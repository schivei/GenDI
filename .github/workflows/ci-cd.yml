name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*', 'release/*' ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci-cd.yml'
      - 'pack.props'
      - 'versions.props'
      - 'sonar-project.properties'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci-cd.yml'
      - 'pack.props'
      - 'versions.props'
      - 'sonar-project.properties'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install SonarScanner for .NET
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && env.SONAR_TOKEN != '' }}
        run: |
          dotnet tool install --global dotnet-sonarscanner --version "9.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: SonarQube begin analysis (.NET scanner)
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && env.SONAR_TOKEN != '' }}
        run: |
          SONAR_ARGS=(
            '/k:schivei_GenDI'
            '/o:schivei'
            "/d:sonar.token=${SONAR_TOKEN}"
            '/d:sonar.host.url=https://sonarcloud.io'
            '/d:sonar.cs.vscoveragexml.reportsPaths=coverage-merged.xml'
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SONAR_ARGS+=(
              "/d:sonar.pullrequest.key=${{ github.event.pull_request.number }}"
              "/d:sonar.pullrequest.branch=${{ github.head_ref }}"
              "/d:sonar.pullrequest.base=${{ github.base_ref }}"
            )
          fi
          dotnet sonarscanner begin "${SONAR_ARGS[@]}"

      - name: Restore dependencies
        run: dotnet restore GenDI.slnx

      - name: Build solution
        run: dotnet build GenDI.slnx --configuration Release --no-restore

      - name: Install coverage tools
        run: |
          dotnet tool install --global dotnet-coverage --version "18.*"
          dotnet tool install --global dotnet-reportgenerator-globaltool --version "5.*"

      - name: Run tests with coverage collection
        run: |
          mkdir -p coverage-results
          # Run each MTP-enabled test project via dotnet-coverage (also enforces pass/fail)
          dotnet-coverage collect \
            "tests/GenDI.SourceGenerator.CoverageEnabled.Tests/bin/Release/net10.0/GenDI.SourceGenerator.CoverageEnabled.Tests" \
            --output coverage-results/cov_coverage_enabled.xml --output-format xml
          dotnet-coverage collect \
            "tests/GenDI.SourceGenerator.CoverageDisabled.Tests/bin/Release/net10.0/GenDI.SourceGenerator.CoverageDisabled.Tests" \
            --output coverage-results/cov_coverage_disabled.xml --output-format xml
          dotnet-coverage collect \
            "tests/GenDI.SourceGenerator.NoCoverageAttribute.Tests/bin/Release/net10.0/GenDI.SourceGenerator.NoCoverageAttribute.Tests" \
            --output coverage-results/cov_nocoverage.xml --output-format xml
          dotnet-coverage collect \
            "tests/GenDI.Integration.Tests/bin/Release/net10.0/GenDI.Integration.Tests" \
            --output coverage-results/cov_integration.xml --output-format xml
          # Run Phase3 publish-validation tests (spawn dotnet publish internally)
          dotnet test tests/GenDI.Phase3.Validation.Tests --configuration Release --no-build --verbosity normal

      - name: Merge coverage and build summary
        id: coverage
        run: |
          dotnet-coverage merge coverage-results/*.xml --output coverage-merged.xml --output-format xml
          reportgenerator \
            -reports:coverage-merged.xml \
            -targetdir:coverage-report \
            -reporttypes:TextSummary \
            -assemblyfilters:"+GenDI;+GenDI.SourceGenerator"
          cat coverage-report/Summary.txt
          LINE_COV=$(grep 'Line coverage:' coverage-report/Summary.txt | sed 's/.*Line coverage: \([0-9.]*\).*/\1/')
          if [ -z "${LINE_COV}" ]; then
            echo "Failed to parse line coverage from summary."
            exit 1
          fi
          echo "Line coverage: ${LINE_COV}%"
          echo "line_coverage=${LINE_COV}" >> "$GITHUB_OUTPUT"
          {
            echo "## Coverage Summary"
            echo ""
            echo "- Line coverage: **${LINE_COV}%**"
            echo "- Threshold: **95.0%**"
            echo ""
            echo "<details><summary>ReportGenerator summary</summary>"
            echo ""
            echo '```text'
            cat coverage-report/Summary.txt
            echo '```'
            echo "</details>"
          } > coverage-report/pr-summary.md

      - name: Enforce 95% coverage threshold
        run: |
          LINE_COV="${{ steps.coverage.outputs.line_coverage }}"
          python3 -c "
          import sys
          try:
              cov = float('${LINE_COV}')
          except ValueError:
              print('Could not parse line coverage value: ${LINE_COV}')
              sys.exit(1)
          threshold = 95.0
          if cov < threshold:
              print(f'Coverage {cov:.1f}% is below the 95% minimum threshold.')
              sys.exit(1)
          print(f'Coverage {cov:.1f}% meets the 95% threshold.')
          "

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage-report/pr-summary.md ]; then
            cat coverage-report/pr-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post coverage summary on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          COVERAGE_LINE: ${{ steps.coverage.outputs.line_coverage }}
        with:
          script: |
            const marker = '<!-- gendi-coverage-summary -->';
            const lineCoverage = process.env.COVERAGE_LINE || 'n/a';
            const threshold = '95.0';
            const status = (lineCoverage !== 'n/a' && Number.parseFloat(lineCoverage) >= Number.parseFloat(threshold))
              ? '✅'
              : '❌';
            const body = `${marker}
            ## GenDI Coverage
            ${status} Line coverage: **${lineCoverage}%** (threshold **${threshold}%**)

            _Source: CI/CD workflow run #${context.runNumber}_`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Run startup benchmark snapshot
        run: dotnet run -c Release --project tests/GenDI.Benchmarks/GenDI.Benchmarks.csproj -- --job Short --filter "*"

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: BenchmarkDotNet.Artifacts/results/*
          retention-days: 14

      - name: SonarQube end analysis (.NET scanner)
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && env.SONAR_TOKEN != '' }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  package:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore GenDI.slnx

      - name: Build release
        run: dotnet build GenDI.slnx --configuration Release --no-restore

      - name: Pack GenDI
        run: dotnet pack src/GenDI/GenDI.csproj --no-build --configuration Release --output ./packages

      - name: Pack GenDI.SourceGenerator
        run: dotnet pack src/GenDI.SourceGenerator/GenDI.SourceGenerator.csproj --no-build --configuration Release --output ./packages

      - name: Get package version
        id: get_version
        run: |
          PKG=$(find ./packages -maxdepth 1 -name 'GenDI.[0-9]*.nupkg' | sort -V | tail -1)
          if [[ -z "$PKG" ]]; then
            echo "::error::No GenDI .nupkg found in ./packages — cannot determine package version."
            exit 1
          fi

          BASENAME=$(basename "$PKG")
          PACKAGE_VERSION="${BASENAME#GenDI.}"
          PACKAGE_VERSION="${PACKAGE_VERSION%.nupkg}"
          echo "Detected package version: $PACKAGE_VERSION"

          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
              echo "::error::Package version '$PACKAGE_VERSION' does not match tag version '$VERSION'."
              exit 1
            fi

            echo "Validated package version against tag version: $VERSION"
          else
            echo "Not a version tag push; using detected package version for downstream jobs."
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
          retention-days: 90

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [package]
    if: github.ref == 'refs/heads/main'
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish to NuGet
        run: dotnet nuget push ./packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: ${{ env.NUGET_API_KEY != '' }}

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./packages/*.nupkg --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        if: ${{ env.GITHUB_TOKEN != '' }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package, publish]
    if: >-
      needs.package.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Determine tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${{ needs.package.outputs.version }}"
          fi
          if [[ "$TAG_NAME" =~ ^v?[0-9]+(\.[0-9]+){2,}-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: ./packages/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
