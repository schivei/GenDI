name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*', 'release/*' ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci-cd.yml'
      - 'pack.props'
      - 'versions.props'
      - 'sonar-project.properties'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci-cd.yml'
      - 'pack.props'
      - 'versions.props'
      - 'sonar-project.properties'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore GenDI.slnx

      - name: Build solution
        run: dotnet build GenDI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GenDI.slnx --configuration Release --no-build --verbosity normal

      - name: Run startup benchmark snapshot
        run: dotnet run -c Release --project tests/GenDI.Benchmarks/GenDI.Benchmarks.csproj -- --job Short --filter "*"

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: BenchmarkDotNet.Artifacts/results/*
          retention-days: 14

      - name: SonarQube analysis
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  package:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore GenDI.slnx

      - name: Build release
        run: dotnet build GenDI.slnx --configuration Release --no-restore

      - name: Pack GenDI
        run: dotnet pack src/GenDI/GenDI.csproj --no-build --configuration Release --output ./packages

      - name: Pack GenDI.SourceGenerator
        run: dotnet pack src/GenDI.SourceGenerator/GenDI.SourceGenerator.csproj --no-build --configuration Release --output ./packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
          retention-days: 90

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [package]
    if: github.ref == 'refs/heads/main'
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish to NuGet
        run: dotnet nuget push ./packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: ${{ env.NUGET_API_KEY != '' }}

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./packages/*.nupkg --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        if: ${{ env.GITHUB_TOKEN != '' }}
