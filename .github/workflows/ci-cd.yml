name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*', 'release/*' ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'website/**'
      - '.github/workflows/ci-cd.yml'
      - 'pack.props'
      - 'versions.props'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'website/**'
      - '.github/workflows/ci-cd.yml'
      - 'pack.props'
      - 'versions.props'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./website/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore GenDI.slnx

      - name: Build solution
        run: dotnet build GenDI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GenDI.slnx --configuration Release --no-build --verbosity normal

      - name: Install website dependencies
        run: npm ci --ignore-scripts
        working-directory: website

      - name: Build website
        run: npm run build
        working-directory: website

      - name: SonarQube analysis (prepared, bypassed)
        if: ${{ secrets.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  package:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore GenDI.slnx

      - name: Build release
        run: dotnet build GenDI.slnx --configuration Release --no-restore

      - name: Pack GenDI
        run: dotnet pack src/GenDI/GenDI.csproj --no-build --configuration Release --output ./packages

      - name: Pack GenDI.SourceGenerator
        run: dotnet pack src/GenDI.SourceGenerator/GenDI.SourceGenerator.csproj --no-build --configuration Release --output ./packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
          retention-days: 90

  publish:
    name: Publish to NuGet (prepared, bypassed)
    runs-on: ubuntu-latest
    needs: [package]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish to NuGet (bypass on failure)
        continue-on-error: true
        run: dotnet nuget push ./packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish to GitHub Packages (bypass on failure)
        continue-on-error: true
        run: dotnet nuget push ./packages/*.nupkg --api-key $GITHUB_TOKEN --source https://nuget.pkg.github.com/schivei/index.json --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
