name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*', 'release/*' ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci-cd.yml'
      - 'pack.props'
      - 'versions.props'
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-calculation:
    name: Version Calculation
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.create-variable.outputs.version }}

    steps:
      - name: Create Variable
        id: create-variable
        shell: pwsh
        run: |
          $year=[System.DateTime]::UtcNow.Year
          $month=[System.DateTime]::UtcNow.Month
          $day=[System.DateTime]::UtcNow.Day
          $patch=[System.DateTime]::UtcNow.Subtract([System.DateTime]::UtcNow.Date).TotalMinutes.ToString("F0")
          $env:VERSION="$year.$month.$day.$patch"
          echo "version=$env:VERSION" >> $GITHUB_ENV
          echo "version=$env:VERSION" >> $GITHUB_OUTPUT
          echo "::set-output name=version::$env:VERSION"

  site-build:
    name: Build Website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./website

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './website/package-lock.json'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build website
        run: npm run build

  build-and-test:
    needs: [version-calculation]
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      COVERAGE_THRESHOLD: "95.0"
      VERSION: ${{ needs.version-calculation.outputs.version }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.x'

      - name: Install SonarScanner for .NET
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && env.SONAR_TOKEN != '' }}
        run: |
          dotnet tool install --global dotnet-sonarscanner --version "9.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: SonarQube begin analysis (.NET scanner)
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && env.SONAR_TOKEN != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          SONAR_ARGS=(
            '/k:schivei_GenDI'
            '/o:schivei'
            "/d:sonar.token=${SONAR_TOKEN}"
            '/d:sonar.host.url=https://sonarcloud.io'
            '/d:sonar.cs.vscoveragexml.reportsPaths=coverage-merged.xml'
            '/d:sonar.exclusions=website/**,**/bin/**,**/obj/**'
            '/d:sonar.coverage.exclusions=tests/**'
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SONAR_ARGS+=(
              "/d:sonar.pullrequest.key=${PR_NUMBER}"
              "/d:sonar.pullrequest.branch=${PR_HEAD_REF}"
              "/d:sonar.pullrequest.base=${PR_BASE_REF}"
            )
          fi
          dotnet sonarscanner begin "${SONAR_ARGS[@]}"

      - name: Restore dependencies
        run: dotnet restore GenDI.slnx

      - name: Build solution
        run: dotnet build GenDI.slnx --configuration Release --no-restore /p:Version="${VERSION}"

      - name: Install coverage tools
        run: |
          dotnet tool install --global dotnet-coverage --version "18.*"
          dotnet tool install --global dotnet-reportgenerator-globaltool --version "5.*"

      - name: Run tests with coverage collection
        run: |
          TEST_TIMEOUT_SECONDS=900
          PHASE_VALIDATION_TIMEOUT_SECONDS=1800
          mkdir -p coverage-results
          # Run each MTP-enabled test project via dotnet-coverage (also enforces pass/fail)
          timeout "${TEST_TIMEOUT_SECONDS}" dotnet-coverage collect \
            "tests/GenDI.SourceGenerator.CoverageEnabled.Tests/bin/Release/net10.0/GenDI.SourceGenerator.CoverageEnabled.Tests" \
            --output coverage-results/cov_coverage_enabled.xml --output-format xml
          timeout "${TEST_TIMEOUT_SECONDS}" dotnet-coverage collect \
            "tests/GenDI.SourceGenerator.CoverageDisabled.Tests/bin/Release/net10.0/GenDI.SourceGenerator.CoverageDisabled.Tests" \
            --output coverage-results/cov_coverage_disabled.xml --output-format xml
          timeout "${TEST_TIMEOUT_SECONDS}" dotnet-coverage collect \
            "tests/GenDI.SourceGenerator.NoCoverageAttribute.Tests/bin/Release/net10.0/GenDI.SourceGenerator.NoCoverageAttribute.Tests" \
            --output coverage-results/cov_nocoverage.xml --output-format xml
          timeout "${TEST_TIMEOUT_SECONDS}" dotnet-coverage collect \
            "tests/GenDI.Integration.Tests/bin/Release/net10.0/GenDI.Integration.Tests" \
            --output coverage-results/cov_integration.xml --output-format xml
          timeout "${TEST_TIMEOUT_SECONDS}" dotnet-coverage collect \
            "tests/GenDI.Analyzers.Tests/bin/Release/net10.0/GenDI.Analyzers.Tests" \
            --output coverage-results/cov_analyzers.xml --output-format xml
          timeout "${TEST_TIMEOUT_SECONDS}" dotnet-coverage collect \
            "tests/GenDI.Testing.Tests/bin/Release/net10.0/GenDI.Testing.Tests" \
            --output coverage-results/cov_testing_helpers.xml --output-format xml
          timeout "${TEST_TIMEOUT_SECONDS}" dotnet-coverage collect \
            "tests/GenDI.Testing.Example.Tests/bin/Release/net10.0/GenDI.Testing.Example.Tests" \
            --output coverage-results/cov_testing_example.xml --output-format xml
          # Run Phase3 publish-validation tests (spawn dotnet publish internally)
          # timeout "${PHASE_VALIDATION_TIMEOUT_SECONDS}" dotnet test tests/GenDI.Phase3.Validation.Tests --configuration Release --no-build --verbosity normal
          # Run Phase6 platform/framework validation tests
          # timeout "${PHASE_VALIDATION_TIMEOUT_SECONDS}" dotnet test tests/GenDI.Phase6.PlatformValidation.Tests --configuration Release --no-build --verbosity normal

      - name: Merge coverage and build summary report
        id: coverage
        run: |
          dotnet-coverage merge coverage-results/*.xml --output coverage-merged.xml --output-format xml
          reportgenerator \
            -reports:coverage-merged.xml \
            -targetdir:coverage-report \
            -reporttypes:TextSummary \
            -assemblyfilters:"+GenDI;+GenDI.SourceGenerator"
          cat coverage-report/Summary.txt
          LINE_COV=$(grep 'Line coverage:' coverage-report/Summary.txt | sed 's/.*Line coverage: \([0-9.]*\).*/\1/')
          echo "Line coverage: ${LINE_COV}%"
          echo "line_coverage=${LINE_COV}" >> "$GITHUB_OUTPUT"
          {
            echo "## Coverage Summary"
            echo ""
            echo "- Line coverage: **${LINE_COV}%**"
            echo "- Threshold: **${COVERAGE_THRESHOLD}%**"
            echo ""
            echo "<details><summary>ReportGenerator summary</summary>"
            echo ""
            echo '```text'
            cat coverage-report/Summary.txt
            echo '```'
            echo "</details>"
          } > coverage-report/pr-summary.md

      - name: Enforce coverage threshold
        run: |
          LINE_COV="${{ steps.coverage.outputs.line_coverage }}"
          COVERAGE_THRESHOLD="${{ env.COVERAGE_THRESHOLD }}"
          python3 -c "
          import sys
          if not '${LINE_COV}':
              print('Failed to parse line coverage from summary.')
              sys.exit(1)
          try:
              cov = float('${LINE_COV}')
          except ValueError:
              print('Could not parse line coverage value: ${LINE_COV}')
              sys.exit(1)
          threshold = float('${COVERAGE_THRESHOLD}')
          if cov < threshold:
              print(f'Coverage {cov:.1f}% is below the {threshold:.1f}% minimum threshold.')
              sys.exit(1)
          print(f'Coverage {cov:.1f}% meets the {threshold:.1f}% threshold.')
          "

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage-report/pr-summary.md ]; then
            cat coverage-report/pr-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post coverage summary on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COVERAGE_LINE: ${{ steps.coverage.outputs.line_coverage }}
        with:
          script: |
            const marker = '<!-- gendi-coverage-summary -->';
            const lineCoverage = process.env.COVERAGE_LINE || 'n/a';
            const body = `${marker}
            ## GenDI Coverage
            Line coverage: **${lineCoverage}%** (threshold **${{ env.COVERAGE_THRESHOLD }}%**)

            _Source: CI/CD workflow run #${context.runNumber}_`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Run startup benchmark snapshot
        run: dotnet run -c Release --project tests/GenDI.Benchmarks/GenDI.Benchmarks.csproj -- --job Short --filter "*"

      - name: Update benchmark documentation snapshot
        env:
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/update_benchmark_docs.py

      - name: Publish benchmark summary
        run: |
          echo "## Startup benchmark snapshot" >> "$GITHUB_STEP_SUMMARY"
          awk '/<!-- benchmark-ci:start -->/{flag=1;next}/<!-- benchmark-ci:end -->/{flag=0}flag' docs/BENCHMARKS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit benchmark documentation updates
        if: >-
          github.event_name == 'pull_request' &&
          !github.event.pull_request.head.repo.fork &&
          github.actor != 'github-actions[bot]'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/BENCHMARKS.md website/docs/advanced/benchmarks.md README.md website/src/data/benchmarkSalesPitch.js
          if git diff --cached --quiet; then
            echo "No benchmark documentation updates to commit."
            exit 0
          fi
          git commit -m "docs: update benchmark snapshot from CI run #${{ github.run_number }}"
          if [ -z "${PR_HEAD_REF}" ] || ! echo "${PR_HEAD_REF}" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Invalid PR_HEAD_REF value for push target."
            exit 1
          fi
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: SonarQube end analysis (.NET scanner)
        if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && env.SONAR_TOKEN != '' }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  package:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [site-build, build-and-test, version-calculation]
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version-calculation.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore GenDI.slnx

      - name: Build release
        run: dotnet build GenDI.slnx --configuration Release --no-restore /p:Version="${VERSION}"

      - name: Pack GenDI
        run: dotnet pack src/GenDI/GenDI.csproj --no-build --configuration Release --output ./packages /p:Version="${VERSION}"

      - name: Pack GenDI.SourceGenerator
        run: dotnet pack src/GenDI.SourceGenerator/GenDI.SourceGenerator.csproj --no-build --configuration Release --output ./packages /p:Version="${VERSION}"

      - name: Pack GenDI.Analyzers
        run: dotnet pack src/GenDI.Analyzers/GenDI.Analyzers.csproj --no-build --configuration Release --output ./packages /p:Version="${VERSION}"
        
      - name: Pack GenDI.Testing
        run: dotnet pack src/GenDI.Testing/GenDI.Testing.csproj --no-build --configuration Release --output ./packages /p:Version="${VERSION}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
          retention-days: 90

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [package]
    if: github.ref == 'refs/heads/main'
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nuget-packages
          path: ./packages

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.x'

      - name: Publish to NuGet
        run: dotnet nuget push ./packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: ${{ env.NUGET_API_KEY != '' }}

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./packages/*.nupkg --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        if: ${{ env.GITHUB_TOKEN != '' }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package, publish, version-calculation]
    if: >-
      needs.package.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version-calculation.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download package artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nuget-packages
          path: ./packages

      - name: Determine tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION}"
          fi
          if [[ "$TAG_NAME" =~ ^v?[0-9]+(\.[0-9]+){2,}-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: ./packages/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
