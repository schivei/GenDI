name: Scheduled Auto-Publish

on:
  schedule:
    - cron: '0 0 8-14 * 4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  auto-publish:
    name: Auto-Publish (Second Thursday)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore GenDI.slnx

      - name: Build all projects
        run: dotnet build GenDI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GenDI.slnx --configuration Release --no-build --verbosity normal

      - name: Pack packages
        run: |
          dotnet pack src/GenDI/GenDI.csproj --no-build --configuration Release --output ./packages
          dotnet pack src/GenDI.SourceGenerator/GenDI.SourceGenerator.csproj --no-build --configuration Release --output ./packages

      - name: Publish to NuGet
        run: dotnet nuget push ./packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./packages/*.nupkg --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
